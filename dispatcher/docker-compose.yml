# docker-compose.yml — WEBHOOK DISPATCHER (fan-out do WhatsApp inbound).
# NÃO faz build: usa a imagem única motor-agendamento:v1 (a mesma dos clientes),
# só troca o comando para rodar o webhook-dispatcher.js embutido nela.
#
# Função: recebe o webhook do provedor de WhatsApp central e repassa pros containers
# dos clientes que estão em WHATSAPP_MODE=central. Descobre esses clientes lendo
# clientes/*/.env (montado read-only).
#
# Subir (de dentro desta pasta):
#   sudo env DOCKER_CONFIG=/DATA/.docker docker compose up -d
#
# Provedor atual: WAHA (ver /waha). Webhook da sessão "agendamento" aponta pra cá.

services:
  dispatcher:
    image: motor-agendamento:v1
    container_name: webhook-dispatcher
    restart: unless-stopped
    command: ["node", "webhook-dispatcher.js"]
    environment:
      - DISPATCH_PORT=3000
      - CLIENTES_DIR=/clientes
    volumes:
      - ../clientes:/clientes:ro   # lê os .env p/ achar quem está em modo central
    networks:
      - agenda-net

# Rede compartilhada com os containers dos clientes.
networks:
  agenda-net:
    external: true
