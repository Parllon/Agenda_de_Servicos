# docker-compose.yml — WEBHOOK DISPATCHER (fan-out do WhatsApp central).
# NÃO faz build: usa a imagem única motor-agendamento:v1 (a mesma dos clientes),
# só troca o comando para rodar o webhook-dispatcher.js embutido nela.
#
# Função: recebe o webhook da instância CENTRAL da Evolution (slotme_central) e
# repassa pros containers dos clientes que estão em WHATSAPP_MODE=central. Ele
# descobre esses clientes sozinho, lendo clientes/*/.env (montado read-only).
#
# Subir (de dentro desta pasta):
#   sudo env DOCKER_CONFIG=/DATA/.docker docker compose up -d
#
# Depois, apontar o webhook da instância central pra cá (UMA vez):
#   curl -X POST http://localhost:8080/webhook/set/slotme_central \
#     -H "apikey: <EVOLUTION_API_KEY>" -H "Content-Type: application/json" \
#     -d '{"webhook":{"url":"http://webhook-dispatcher:3000/webhook-whatsapp","events":["MESSAGES_UPSERT"]}}'

services:
  dispatcher:
    image: motor-agendamento:v1
    container_name: webhook-dispatcher
    restart: unless-stopped
    command: ["node", "webhook-dispatcher.js"]
    environment:
      - DISPATCH_PORT=3000
      - CLIENTES_DIR=/clientes
    volumes:
      - ../clientes:/clientes:ro   # lê os .env p/ achar quem está em modo central
    networks:
      - agenda-net

# Mesma rede compartilhada com a Evolution e com os containers dos clientes.
networks:
  agenda-net:
    external: true
