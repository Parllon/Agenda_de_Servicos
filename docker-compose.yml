# docker-compose.yml — sobe a API e o cron de lembretes.
# No ZimaOS: App Store → "Install a Custom App" → cole este YAML.
#
# Antes de subir, garanta na mesma pasta:
#   - .env              (configurações e segredos)
#   - credentials.json  (Service Account do Google)
#
# Primeira vez, rode o seed (popula profissional + serviços):
#   docker compose run --rm api node seed.js

services:
  api:
    build: .
    image: agendamento-manicure
    container_name: agendamento-api
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/agendamentos.db   # banco no volume persistente
    ports:
      - "8090:3000"                     # host 8090 → container 3000 (3000 estava ocupada)
    volumes:
      - agendamento-data:/data
      - ./credentials.json:/app/credentials.json:ro

  cron:
    build: .                            # constrói da mesma receita (cache reaproveita)
    image: agendamento-manicure         # mesma imagem da api
    container_name: agendamento-cron
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/agendamentos.db   # MESMO banco da api
    command: ["node", "cron-lembretes.js"]
    volumes:
      - agendamento-data:/data
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - api

volumes:
  agendamento-data: