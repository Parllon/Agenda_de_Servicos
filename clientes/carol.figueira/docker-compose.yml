# docker-compose.yml — UMA INSTÂNCIA DE CLIENTE. NÃO faz build: usa a imagem única
# motor-agendamento:v1 (gerada uma vez a partir de /app). Tudo que varia vem do
# .env e do dados.json desta pasta.
#
# Pré-requisito (uma vez por servidor): a rede compartilhada com a Evolution global
#   docker network create agenda-net
#   (e conecte a Evolution global a essa mesma rede)
#
# Fluxo para subir este cliente (de dentro da pasta dele):
#   docker compose up -d
#   docker compose run --rm app node seed.js     # popula a partir do dados.json
#   docker compose restart                       # recarrega dados/agenda em memória

services:
  app:
    image: motor-agendamento:v1
    container_name: ${CLIENTE}-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORTA_EXTERNA}:3000"                          # externa única : 3000 interna
    volumes:
      - ./banco_dados:/data                              # SQLite persistente (no host)
      - ./dados.json:/cliente/dados.json:ro              # ficha do cliente (read-only)
      - ./fotos:/app/public/fotos:ro                     # fotos dos profissionais deste cliente
      - ../../app/credentials.json:/app/credentials.json:ro  # service account compartilhada
    networks:
      - agenda-net

  cron:
    image: motor-agendamento:v1
    container_name: ${CLIENTE}-cron
    restart: unless-stopped
    env_file: .env
    command: ["node", "cron-lembretes.js"]
    volumes:
      - ./banco_dados:/data
      - ./dados.json:/cliente/dados.json:ro
      - ../../app/credentials.json:/app/credentials.json:ro
    networks:
      - agenda-net
    depends_on:
      - app

# Rede externa compartilhada com a Evolution global (WhatsApp centralizado na 8080).
networks:
  agenda-net:
    external: true
