# docker-compose.full.yml — stack completo: app + cron + Evolution API + Postgres.
# Use este quando for migrar o WhatsApp para a Evolution.
#
# Para subir (no Zima):
#   sudo env DOCKER_CONFIG=/DATA/.docker docker compose -f docker-compose.full.yml up -d --build
#
# A app conversa com a Evolution pela REDE INTERNA do compose (nome do serviço):
#   WHATSAPP_API_URL=http://evolution-api:8080

services:
  api:
    build: .
    image: agendamento-manicure
    container_name: agendamento-api
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/agendamentos.db
    ports:
      - "8090:3000"
    volumes:
      - agendamento-data:/data
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - evolution-api

  cron:
    build: .
    image: agendamento-manicure
    container_name: agendamento-cron
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/agendamentos.db
    command: ["node", "cron-lembretes.js"]
    volumes:
      - agendamento-data:/data
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      - api

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7 # <-- Hífen adicionado aqui
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"                       # painel/manager: http://IP-DO-ZIMA:8080/manager
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution-postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - CACHE_LOCAL_ENABLED=true
      - CACHE_REDIS_ENABLED=false
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1040656236
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      - evolution-postgres

  evolution-postgres:
    image: postgres:15-alpine # <-- Imagem corrigida para o banco de dados
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - evolution-pg:/var/lib/postgresql/data

volumes:
  agendamento-data:
  evolution-instances:
  evolution-pg:
