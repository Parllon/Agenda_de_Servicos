# docker-compose.barbearia.yml — 2ª instância (Navalha de Ouro) para TESTAR o tema
# barbearia AO LADO da Bya, sem tocar na produção. Porta e banco próprios.
#
# Subir (no Zima):
#   sudo env DOCKER_CONFIG=/DATA/.docker docker compose -f docker-compose.barbearia.yml up -d --build
# Popular os dados de exemplo da barbearia (1ª vez, e quando mudar serviços):
#   sudo env DOCKER_CONFIG=/DATA/.docker docker compose -f docker-compose.barbearia.yml run --rm api node seed.js
# Acessar no navegador:  http://IP-DO-ZIMA:8091
# Derrubar quando terminar o teste:
#   sudo env DOCKER_CONFIG=/DATA/.docker docker compose -f docker-compose.barbearia.yml down
#
# Notas:
# - Reaproveita a MESMA imagem/código da Bya. O que muda é só o .env (tema + dados)
#   e o volume do banco. Corrigiu um bug no código? Vale para os dois.
# - Sem Evolution aqui DE PROPÓSITO: o WhatsApp não envia neste teste (o agendamento
#   e o Google Calendar funcionam normalmente). Mantém o teste simples e isolado.

services:
  api:
    build: .
    image: agendamento-manicure          # mesma imagem da Bya (reaproveita o build)
    container_name: barbearia-api
    restart: unless-stopped
    env_file: .env.barbearia
    environment:
      - DB_PATH=/data/agendamentos.db
    ports:
      - "8091:3000"                       # porta DIFERENTE da Bya (que usa 8090)
    volumes:
      - barbearia-data:/data              # banco PRÓPRIO, isolado da Bya
      - ./credentials.json:/app/credentials.json:ro

volumes:
  barbearia-data:                          # volume separado -> ids não conflitam com a Bya
