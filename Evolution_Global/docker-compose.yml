# Evolution_Global/docker-compose.yml — WhatsApp CENTRALIZADO (uma Evolution p/ todos
# os clientes). Cada cliente cria a SUA instância dentro desta Evolution (uma conexão
# de WhatsApp por salão), identificada pelo WHATSAPP_INSTANCE do .env do cliente.
#
# Subir:
#   docker network create agenda-net        # uma vez por servidor (se ainda não existe)
#   docker compose up -d
# Manager (criar/conectar instâncias, ler QR):  http://192.168.1.100:8080/manager

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7   # imagem que funciona na sua produção
    container_name: evolution-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution-postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - CACHE_LOCAL_ENABLED=true
      - CACHE_REDIS_ENABLED=false
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION}
    volumes:
      - evolution-instances:/evolution/instances
    networks:
      - agenda-net
    depends_on:
      - evolution-postgres

  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - evolution-pg:/var/lib/postgresql/data
    networks:
      - agenda-net

volumes:
  evolution-instances:
  evolution-pg:

# Rede compartilhada: é por ela que os containers dos clientes chegam na Evolution
# pelo nome "evolution-api". Os clientes declaram esta mesma rede como external.
networks:
  agenda-net:
    external: true